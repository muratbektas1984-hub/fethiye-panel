<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kutay Fethiye - Barkod Sayım</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <script src="https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js"></script>
    <style>
        body { touch-action: manipulation; }
    </style>
</head>
<body class="bg-slate-950 text-white min-h-screen flex flex-col">

    <header class="bg-slate-900 border-b border-slate-800 px-4 py-3 flex items-center justify-between sticky top-0 z-20">
        <div class="flex items-center gap-2.5">
            <div class="bg-blue-600 p-2 rounded-lg">
                <i class="fa-solid fa-barcode text-sm text-white"></i>
            </div>
            <div>
                <h1 class="text-sm font-bold leading-tight">Kutay Fethiye - Barkod Sayım</h1>
                <p id="sessionInfo" class="text-[11px] text-amber-300 font-semibold">İrsaliye oturumu bekleniyor...</p>
            </div>
        </div>
        <button type="button" id="connStatus" onclick="initFirebaseConnection(true)" class="text-[11px] font-bold text-amber-300">
            <i class="fa-solid fa-circle text-[8px]"></i> Bağlanıyor...
        </button>
    </header>

    <main class="flex-1 max-w-md w-full mx-auto p-3 space-y-3 pb-10">

        <!-- Kamera Görüntüsü -->
        <section class="bg-slate-900 border border-slate-800 rounded-xl overflow-hidden shadow-lg">
            <div class="relative w-full h-56 bg-black flex items-center justify-center">
                <video id="barcodeVideo" class="w-full h-full object-cover" playsinline autoplay muted></video>
                <div id="barcodeLaserBox" class="hidden pointer-events-none absolute inset-x-5 h-20 border-2 border-emerald-400 rounded-lg shadow-[0_0_0_9999px_rgba(0,0,0,0.45)]"></div>
                <div id="barcodeIdleView" class="absolute inset-0 flex flex-col items-center justify-center text-slate-400 text-xs font-semibold px-4 text-center bg-slate-900/90">
                    <i class="fa-solid fa-barcode text-2xl mb-2 text-blue-400"></i>
                    <span>Barkod okutmak için "Barkod Oku" butonuna basın.</span>
                </div>
            </div>
            <div class="px-3 py-2 bg-slate-900/95 border-t border-slate-800 flex items-center justify-between text-[11px]">
                <span id="barcodeStatusText" class="text-slate-300 font-medium truncate">Hazır</span>
                <button type="button" onclick="stopBarcodeScan()" class="text-rose-400 hover:text-rose-300 font-bold ml-2 shrink-0">
                    <i class="fa-solid fa-stop mr-1"></i>Kapat
                </button>
            </div>
        </section>

        <!-- Barkod Oku Butonu -->
        <button type="button" id="barkodOkuBtn" onclick="startBarcodeScan()" class="w-full bg-blue-600 hover:bg-blue-700 active:scale-[0.99] text-white font-bold py-3 rounded-xl shadow transition flex items-center justify-center gap-2 text-sm">
            <i class="fa-solid fa-barcode text-base"></i> Barkod Oku
        </button>

        <!-- Parça No -->
        <div class="bg-slate-900 border border-slate-800 rounded-xl p-3 space-y-1">
            <div class="flex items-center justify-between">
                <label for="parcaNoInput" class="block text-xs font-bold text-slate-300">Parça No</label>
                <span id="matchBadge" class="text-[10px] font-bold px-2 py-0.5 rounded bg-slate-800 text-slate-300">Eşleşme bekleniyor</span>
            </div>
            <input type="text" id="parcaNoInput" oninput="refreshMatchBadge()" placeholder="Barkod okutun veya parça no girin" class="w-full bg-slate-950 border border-slate-700 focus:border-blue-500 rounded-lg px-3 py-2.5 text-sm font-mono font-bold text-emerald-400 uppercase focus:outline-none">
        </div>

        <!-- Adet -->
        <div class="bg-slate-900 border border-slate-800 rounded-xl p-3 space-y-1">
            <label for="adetInput" class="block text-xs font-bold text-slate-300">Adet</label>
            <input type="number" id="adetInput" min="1" value="1" class="w-full bg-slate-950 border border-slate-700 focus:border-blue-500 rounded-lg px-3 py-2.5 text-sm font-bold text-white focus:outline-none">
        </div>

        <!-- Ekle -->
        <button type="button"
