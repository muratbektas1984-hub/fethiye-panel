<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Kutay Fethiye - Mobil Barkod Okutma</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <script src="https://unpkg.com/@zxing/library@0.20.0/umd/index.min.js"></script>
    <style>
        body { touch-action: manipulation; }
        #cameraVideo {
            width: 100%;
            height: 220px;
            object-fit: cover;
            border-radius: 0.75rem;
            background: #0f172a;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans pb-10">
    <header class="bg-slate-900 border-b border-slate-800 px-4 py-3 flex items-center justify-between sticky top-0 z-20">
        <div class="flex items-center gap-2">
            <i class="fa-solid fa-barcode text-amber-400 text-lg"></i>
            <span class="font-black text-sm tracking-tight">Kutay Fethiye - Barkod Okutma</span>
        </div>
        <span id="baglantiDurumu" class="text-[11px] font-bold text-amber-300">Bağlanıyor...</span>
    </header>

    <main class="max-w-md mx-auto p-3 space-y-3">
        <!-- 1. Üstte Kamera Ekranı -->
        <section class="bg-slate-900 border border-slate-800 rounded-xl p-2.5">
            <video id="cameraVideo" playsinline muted></video>
        </section>

        <!-- 2. Altında Barkod Oku -->
        <section>
            <button type="button" id="barkodOkuBtn" onclick="toggleCamera()" class="w-full bg-emerald-600 hover:bg-emerald-700 active:bg-emerald-800 text-white font-black text-sm py-3 rounded-xl shadow flex items-center justify-center gap-2">
                <i class="fa-solid fa-camera"></i> <span id="barkodOkuLabel">Barkod Oku</span>
            </button>
        </section>

        <!-- 3. Altında Okunan Numaranın Yazılması -->
        <section class="bg-slate-900 border border-slate-800 rounded-xl p-3 space-y-1.5">
            <label for="okunanParcaNo" class="block text-xs font-black uppercase text-amber-300">Okunan Parça Numarası</label>
            <input type="text" id="okunanParcaNo" autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false" placeholder="Örn: 172025527R" class="w-full bg-slate-950 border border-amber-500 rounded-lg px-3 py-2.5 text-sm font-mono font-black text-emerald-300 uppercase focus:outline-none focus:ring-2 focus:ring-amber-400">
        </section>

        <!-- 4. Altında Adet -->
        <section class="bg-slate-900 border border-slate-800 rounded-xl p-3 space-y-1.5">
            <label for="parcaAdet" class="block text-xs font-black uppercase text-amber-300">Adet</label>
            <input type="number" id="parcaAdet" min="1" value="1" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2.5 text-sm font-bold text-white focus:outline-none focus:ring-2 focus:ring-blue-500">
        </section>

        <!-- 5. Altında Ekle -->
        <section>
            <button type="button" onclick="ekleParca()" class="w-full bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white font-black text-sm py-3 rounded-xl shadow flex items-center justify-center gap-2">
                <i class="fa-solid fa-plus-circle"></i> Ekle
            </button>
        </section>

        <!-- 6. Altında Okutulan Parçalar -->
        <section class="bg-slate-900 border border-slate-800 rounded-xl p-3 space-y-2">
            <div class="flex items-center justify-between border-b border-slate-800 pb-2">
                <h2 class="text-xs font-black uppercase text-slate-200">Okutulan Parçalar</h2>
                <span id="irsaliyeNoEtiket" class="text-[11px] font-bold text-amber-300">İrsaliye: -</span>
            </div>
            <div id="okutulanParcalarListe" class="divide-y divide-slate-800 text-xs">
                <p class="py-4 text-center text-slate-500">Henüz okutulan parça yok.</p>
            </div>
        </section>
    </main>

    <script>
        const KULLANICI = "Mobil Cihaz";
        const firebaseConfig = {
            apiKey: "AIzaSyCkXKhtHVj3wImlSOI7vNfv4LAFLmrtqYc",
            authDomain: "siparis-takip-4d2a7.firebaseapp.com",
            databaseURL: "https://siparis-takip-4d2a7-default-rtdb.firebaseio.com",
            projectId: "siparis-takip-4d2a7",
            storageBucket: "siparis-takip-4d2a7.firebasestorage.app",
            messagingSenderId: "442166924279",
            appId: "1:442166924279:web:ac8103ee871918e524d4f2",
            measurementId: "G-FLCPTLX79X"
        };

        const app = firebase.apps.length ? firebase.app() : firebase.initializeApp(firebaseConfig);
        const db = firebase.database(app);
        const wbRef = db.ref("kutay_fethiye_aktif_kabul");

        let aktifIrsaliye = null;
        let codeReader = null;
        let kameraAcik = false;
        let sonOkunanKod = "";
        let sonOkumaZamani = 0;
        let sonTemizGiris = "";
        let sonGirisZamani = 0;

        // 172025527R1 -> 172025527R gibi parça no sonuna yapışan tekil "1" karakterini ayıklar
        function cleanCode(val) {
            let s = String(val || "").trim().toUpperCase();
            s = s.replace(/^P[\s\-:\/]*/i, "");
            s = s.replace(/[^A-Z0-9]/g, "");
            s = s.replace(/^P+/, "");
            if (/^[A-Z0-9]{6,}1$/.test(s)) {
                s = s.slice(0, -1);
            }
            return s;
        }

        const parcaInput = document.getElementById("okunanParcaNo");
        const adetInput = document.getElementById("parcaAdet");

        function temizleGirisKutusu() {
            const ham = String(parcaInput.value || "");
            const simdi = Date.now();
            let temiz = cleanCode(ham);

            if (sonTemizGiris && (simdi - sonGirisZamani < 600) && temiz === sonTemizGiris + "1") {
                temiz = sonTemizGiris;
            }

            if (temiz && ham.toUpperCase() !== temiz) {
                parcaInput.value = temiz;
            }

            if (temiz) {
                sonTemizGiris = temiz;
                sonGirisZamani = simdi;
            }

            return temiz;
        }

        ["input", "change", "blur"].forEach(olay => {
            parcaInput.addEventListener(olay, () => {
                temizleGirisKutusu();
                setTimeout(temizleGirisKutusu, 30);
            });
        });

        parcaInput.addEventListener("paste", () => {
            setTimeout(temizleGirisKutusu, 15);
            setTimeout(temizleGirisKutusu, 60);
        });

        parcaInput.addEventListener("keydown", (e) => {
            if (e.key === "Enter") {
                e.preventDefault();
                setTimeout(ekleParca, 20);
            }
        });

        db.ref(".info/connected").on("value", (snap) => {
            const el = document.getElementById("baglantiDurumu");
            if (snap.val() === true) {
                el.className = "text-[11px] font-bold text-emerald-400";
                el.textContent = "Online";
            } else {
                el.className = "text-[11px] font-bold text-amber-300";
                el.textContent = "Bağlanıyor...";
            }
        });

        wbRef.on("value", (snap) => {
            aktifIrsaliye = snap.val() || null;
            renderOkutulanParcalar();
        });

        function renderOkutulanParcalar() {
            const etiket = document.getElementById("irsaliyeNoEtiket");
            const liste = document.getElementById("okutulanParcalarListe");

            if (!aktifIrsaliye) {
                etiket.textContent = "İrsaliye: -";
                liste.innerHTML = '<p class="py-4 text-center text-slate-500">Henüz okutulan parça yok.</p>';
                return;
            }

            etiket.textContent = `İrsaliye: ${aktifIrsaliye.irsaliyeNo || "-"}`;

            const okutulanlar = aktifIrsaliye.okutulanlar && typeof aktifIrsaliye.okutulanlar === "object"
                ? Object.values(aktifIrsaliye.okutulanlar).filter(Boolean)
                : [];

            if (!okutulanlar.length) {
                liste.innerHTML = '<p class="py-4 text-center text-slate-500">Henüz okutulan parça yok.</p>';
                return;
            }

            liste.innerHTML = okutulanlar.slice().reverse().map((item) => {
                const kod = cleanCode(item.kod);
                const adet = parseInt(item.adet, 10) || 1;
                const zaman = item.zaman || "";
                return `
                    <div class="py-2.5 flex items-center justify-between gap-2">
                        <div>
                            <span class="font-mono font-black text-emerald-400 text-sm">${kod}</span>
                            <span class="text-[11px] text-slate-400 ml-2">${zaman}</span>
                        </div>
                        <span class="font-mono font-black text-white bg-slate-800 px-2.5 py-1 rounded">${adet} Adet</span>
                    </div>
                `;
            }).join("");
        }

        async function ekleParca() {
            const temizKod = cleanCode(parcaInput.value || temizleGirisKutusu());
            const adet = Math.max(1, parseInt(adetInput.value, 10) || 1);

            if (!temizKod) {
                alert("Lütfen parça numarası okutun veya yazın.");
                return;
            }

            parcaInput.value = temizKod;

            if (!aktifIrsaliye || !aktifIrsaliye.active) {
                alert("Önce yönetici panelinden aktif irsaliye oturumu başlatın.");
                return;
            }

            const kayitKey = "sc_" + Date.now() + "_" + Math.random().toString(36).slice(2, 6);
            await wbRef.child("okutulanlar").child(kayitKey).set({
                kod: temizKod,
                adet,
                okutan: KULLANICI,
                zaman: new Date().toLocaleTimeString("tr-TR")
            });

            parcaInput.value = "";
            sonTemizGiris = "";
            adetInput.value = "1";
            parcaInput.focus();
        }

        function barkodYakalandi(hamMetin) {
            const simdi = Date.now();
            const temizKod = cleanCode(hamMetin);
            if (!temizKod) return;
            if (temizKod === sonOkunanKod && (simdi - sonOkumaZamani < 1500)) return;

            sonOkunanKod = temizKod;
            sonOkumaZamani = simdi;
            sonTemizGiris = temizKod;
            sonGirisZamani = simdi;

            parcaInput.value = temizKod;
        }

        async function kameraAc() {
            const video = document.getElementById("cameraVideo");
            const label = document.getElementById("barkodOkuLabel");
            kameraAcik = true;
            label.textContent = "Kamerayı Kapat";

            if (window.ZXing && ZXing.BrowserMultiFormatReader) {
                if (!codeReader) {
                    codeReader = new ZXing.BrowserMultiFormatReader();
                }
                try {
                    await codeReader.decodeFromVideoDevice(null, video, (result) => {
                        if (result && result.getText) {
                            barkodYakalandi(result.getText());
                        }
                    });
                    return;
                } catch (_) {}
            }

            if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
                video.srcObject = stream;
                await video.play();

                if ("BarcodeDetector" in window) {
                    const detector = new BarcodeDetector();
                    const tara = async () => {
                        if (!kameraAcik) return;
                        try {
                            const codes = await detector.detect(video);
                            if (codes.length && codes[0].rawValue) {
                                barkodYakalandi(codes[0].rawValue);
                            }
                        } catch (_) {}
                        requestAnimationFrame(tara);
                    };
                    requestAnimationFrame(tara);
                }
            }
        }

        function kameraKapat() {
            const video = document.getElementById("cameraVideo");
            const label = document.getElementById("barkodOkuLabel");
            kameraAcik = false;
            label.textContent = "Barkod Oku";

            if (codeReader) {
                try { codeReader.reset(); } catch (_) {}
            }
            if (video && video.srcObject) {
                video.srcObject.getTracks().forEach((t) => t.stop());
                video.srcObject = null;
            }
        }

        function toggleCamera() {
            if (kameraAcik) {
                kameraKapat();
            } else {
                kameraAc();
            }
        }
    </script>
</body>
</html>
