<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Kutay Fethiye - Mobil Barkod & İrsaliye</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <script src="https://unpkg.com/@zxing/library@0.20.0/umd/index.min.js"></script>
    <style>
        body { touch-action: manipulation; }
        #scannerVideo { width: 100%; max-height: 240px; object-fit: cover; border-radius: 0.75rem; background: #0f172a; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen pb-10 font-sans">
    <header class="bg-slate-900 border-b border-slate-800 sticky top-0 z-30 px-4 py-3 flex items-center justify-between">
        <div class="flex items-center gap-2.5">
            <div class="bg-blue-600 p-2 rounded-lg text-white">
                <i class="fa-solid fa-barcode text-lg"></i>
            </div>
            <div>
                <h1 class="text-sm font-black tracking-tight text-white">Kutay Fethiye - Mobil Okutma</h1>
                <p id="connStatus" class="text-[11px] font-bold text-amber-300">Bağlanıyor...</p>
            </div>
        </div>
        <button type="button" onclick="toggleCameraScanner()" id="camToggleBtn" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold px-3 py-2 rounded-lg flex items-center gap-1.5">
            <i class="fa-solid fa-camera"></i> <span id="camToggleLabel">Kamerayı Aç</span>
        </button>
    </header>

    <main class="max-w-md mx-auto p-3 space-y-4">
        <!-- Kamera Barkod Okuyucu -->
        <section id="scannerBox" class="hidden bg-slate-900 border border-slate-700 rounded-xl p-3 space-y-2">
            <div class="flex items-center justify-between text-xs">
                <span class="font-bold text-emerald-400"><i class="fa-solid fa-qrcode mr-1"></i> Barkodu Okutun</span>
                <button type="button" onclick="stopCameraScanner()" class="text-rose-400 font-bold">Kapat</button>
            </div>
            <video id="scannerVideo" playsinline muted></video>
            <p id="scannerHint" class="text-[11px] text-slate-400">Barkodu kameraya tutun; okunan kod otomatik temizlenir.</p>
        </section>

        <!-- Mod Seçimi -->
        <div class="grid grid-cols-2 gap-2 bg-slate-900 p-1 rounded-xl border border-slate-800">
            <button type="button" id="modeWaybillBtn" onclick="setScanMode('waybill')" class="bg-amber-600 text-white text-xs font-black py-2.5 rounded-lg">
                İrsaliye Kabul
            </button>
            <button type="button" id="modeOrderBtn" onclick="setScanMode('order')" class="bg-slate-800 text-slate-300 text-xs font-bold py-2.5 rounded-lg">
                Sipariş / Parça Giriş
            </button>
        </div>

        <!-- Parça Okutma / Giriş Kutusu -->
        <section class="bg-slate-900 border border-slate-800 rounded-xl p-4 space-y-3">
            <div class="flex items-center justify-between">
                <label for="barcodeInput" class="text-xs font-black uppercase text-amber-300">Parça Numarası</label>
                <span id="activeWaybillBadge" class="text-[11px] font-bold px-2 py-0.5 rounded bg-slate-800 text-slate-300">İrsaliye: -</span>
            </div>

            <div class="flex gap-2">
                <input type="text" id="barcodeInput" autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false" placeholder="Örn: 172025527R" class="flex-1 bg-slate-950 border border-amber-500 rounded-lg px-3 py-2.5 text-sm font-mono font-black text-emerald-300 uppercase focus:outline-none focus:ring-2 focus:ring-amber-500">
                <input type="number" id="qtyInput" min="1" value="1" class="w-20 bg-slate-950 border border-slate-700 rounded-lg px-2 py-2.5 text-sm font-bold text-center text-white">
            </div>

            <div id="orderExtraFields" class="hidden space-y-2.5 pt-1">
                <div class="grid grid-cols-2 gap-2">
                    <input type="text" id="plateInput" placeholder="Plaka (Örn: 48ABC123)" class="bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-xs font-bold uppercase text-white">
                    <input type="text" id="advisorInput" placeholder="Danışman" class="bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-xs font-semibold text-white">
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <select id="deptInput" class="bg-slate-950 border border-slate-700 rounded-lg px-2.5 py-2 text-xs font-bold text-white">
                        <option value="Mekanik">Mekanik</option>
                        <option value="Kaporta">Kaporta</option>
                    </select>
                    <input type="text" id="descInput" placeholder="Parça Açıklaması" class="bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-xs font-semibold text-white">
                </div>
            </div>

            <button type="button" onclick="submitCurrentCode()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-black text-xs py-3 rounded-xl shadow flex items-center justify-center gap-2">
                <i class="fa-solid fa-check-circle"></i> <span id="submitBtnText">İrsaliyeye İşle</span>
            </button>

            <div id="lastResultBox" class="hidden bg-slate-950 border border-emerald-700/60 rounded-lg p-3 text-xs space-y-1">
                <div class="flex items-center justify-between">
                    <span class="text-slate-400">Son Okunan Ham:</span>
                    <span id="rawReadText" class="font-mono text-rose-300">-</span>
                </div>
                <div class="flex items-center justify-between">
                    <span class="text-slate-400">Temizlenen Kod:</span>
                    <span id="cleanedReadText" class="font-mono font-black text-emerald-400 text-sm">-</span>
                </div>
                <p id="resultFeedback" class="text-[11px] font-bold text-amber-200 pt-1"></p>
            </div>
        </section>

        <!-- Aktif İrsaliye Listesi -->
        <section id="waybillListSection" class="bg-slate-900 border border-slate-800 rounded-xl p-3 space-y-2">
            <h2 class="text-xs font-black uppercase text-slate-300">Aktif İrsaliye Durumu</h2>
            <div id="waybillItemsContainer" class="divide-y divide-slate-800 text-xs">
                <p class="py-4 text-center text-slate-500">Aktif irsaliye oturumu bekleniyor...</p>
            </div>
        </section>
    </main>

    <script>
        const MOBIL_KULLANICI = "Mobil Cihaz";
        const firebaseConfig = {
            apiKey: "AIzaSyCkXKhtHVj3wImlSOI7vNfv4LAFLmrtqYc",
            authDomain: "siparis-takip-4d2a7.firebaseapp.com",
            databaseURL: "https://siparis-takip-4d2a7-default-rtdb.firebaseio.com",
            projectId: "siparis-takip-4d2a7",
            storageBucket: "siparis-takip-4d2a7.firebasestorage.app",
            messagingSenderId: "442166924279",
            appId: "1:442166924279:web:ac8103ee871918e524d4f2",
            measurementId: "G-FLCPTLX79X"
        };

        const app = firebase.apps.length ? firebase.app() : firebase.initializeApp(firebaseConfig);
        const db = firebase.database(app);
        const ordersRef = db.ref("kutay_fethiye_orders");
        const wbRef = db.ref("kutay_fethiye_aktif_kabul");

        let scanMode = "waybill";
        let activeWb = null;
        let codeReader = null;
        let lastScanTime = 0;
        let lastScanCode = "";

        // 172025527R1 -> 172025527R gibi sonuna yapışan tekil "1" karakterini temizler
        function cleanCode(val) {
            let s = String(val || "").trim().toUpperCase();
            s = s.replace(/^P[\s\-:\/]*/i, "");
            s = s.replace(/[^A-Z0-9]/g, "");
            s = s.replace(/^P+/, "");
            if (/^[A-Z0-9]{6,}1$/.test(s)) {
                s = s.slice(0, -1);
            }
            return s;
        }

        function syncBarcodeInput() {
            const inp = document.getElementById("barcodeInput");
            const raw = String(inp.value || "");
            const cleaned = cleanCode(raw);
            if (cleaned && cleaned !== raw.trim().toUpperCase()) {
                inp.value = cleaned;
            }
            return cleaned;
        }

        const barcodeInputEl = document.getElementById("barcodeInput");
        ["input", "change", "blur"].forEach(ev => {
            barcodeInputEl.addEventListener(ev, () => syncBarcodeInput());
        });
        barcodeInputEl.addEventListener("paste", () => setTimeout(() => syncBarcodeInput(), 10));
        barcodeInputEl.addEventListener("keydown", (e) => {
            if (e.key === "Enter") {
                e.preventDefault();
                submitCurrentCode();
            }
        });

        db.ref(".info/connected").on("value", (snap) => {
            const el = document.getElementById("connStatus");
            if (snap.val() === true) {
                el.className = "text-[11px] font-bold text-emerald-400";
                el.textContent = "Online (Bağlı)";
            } else {
                el.className = "text-[11px] font-bold text-amber-300";
                el.textContent = "Bağlanıyor...";
            }
        });

        wbRef.on("value", (snap) => {
            activeWb = snap.val() || null;
            renderWaybillSummary();
        });

        function setScanMode(mode) {
            scanMode = mode;
            const wbBtn = document.getElementById("modeWaybillBtn");
            const ordBtn = document.getElementById("modeOrderBtn");
            const extra = document.getElementById("orderExtraFields");
            const submitText = document.getElementById("submitBtnText");
            const wbSection = document.getElementById("waybillListSection");

            if (mode === "waybill") {
                wbBtn.className = "bg-amber-600 text-white text-xs font-black py-2.5 rounded-lg";
                ordBtn.className = "bg-slate-800 text-slate-300 text-xs font-bold py-2.5 rounded-lg";
                extra.classList.add("hidden");
                wbSection.classList.remove("hidden");
                submitText.textContent = "İrsaliyeye İşle";
            } else {
                ordBtn.className = "bg-blue-600 text-white text-xs font-black py-2.5 rounded-lg";
                wbBtn.className = "bg-slate-800 text-slate-300 text-xs font-bold py-2.5 rounded-lg";
                extra.classList.remove("hidden");
                wbSection.classList.add("hidden");
                submitText.textContent = "Siparişe Kaydet";
            }
        }

        function showReadResult(rawCode, cleanedCode, message) {
            document.getElementById("lastResultBox").classList.remove("hidden");
            document.getElementById("rawReadText").textContent = rawCode || "-";
            document.getElementById("cleanedReadText").textContent = cleanedCode || "-";
            document.getElementById("resultFeedback").textContent = message;
        }

        function renderWaybillSummary() {
            const badge = document.getElementById("activeWaybillBadge");
            const container = document.getElementById("waybillItemsContainer");
            if (!activeWb || !activeWb.active) {
                badge.textContent = "İrsaliye: Kapalı";
                container.innerHTML = '<p class="py-4 text-center text-slate-500">Aktif irsaliye oturumu kapalı.</p>';
                return;
            }

            badge.textContent = `İrsaliye: ${activeWb.irsaliyeNo || "Aktif"}`;
            const expMap = {};
            if (activeWb.beklenen) {
                Object.entries(activeWb.beklenen).forEach(([k, v]) => {
                    const c = cleanCode(k);
                    if (c) expMap[c] = (expMap[c] || 0) + (parseInt(v, 10) || 1);
                });
            }
            const scMap = {};
            if (activeWb.okutulanlar) {
                Object.values(activeWb.okutulanlar).forEach(item => {
                    if (!item) return;
                    const c = cleanCode(item.kod);
                    if (c) scMap[c] = (scMap[c] || 0) + (parseInt(item.adet, 10) || 1);
                });
            }

            const keys = Array.from(new Set([...Object.keys(expMap), ...Object.keys(scMap)]));
            if (!keys.length) {
                container.innerHTML = '<p class="py-4 text-center text-slate-500">Henüz kalem yok.</p>';
                return;
            }

            container.innerHTML = keys.map(code => {
                const exp = expMap[code] || 0;
                const sc = scMap[code] || 0;
                const color = sc === exp && exp > 0 ? "text-emerald-400" : "text-amber-300";
                return `
                    <div class="py-2 flex items-center justify-between">
                        <span class="font-mono font-black text-white">${code}</span>
                        <span class="font-mono font-bold ${color}">${sc} / ${exp}</span>
                    </div>
                `;
            }).join("");
        }

        async function submitCurrentCode(rawOverride = "") {
            const rawInput = rawOverride || barcodeInputEl.value;
            const cleaned = cleanCode(rawInput);
            const qty = Math.max(1, parseInt(document.getElementById("qtyInput").value, 10) || 1);

            if (!cleaned) {
                alert("Lütfen geçerli bir parça numarası okutun veya girin.");
                return;
            }

            barcodeInputEl.value = cleaned;

            if (scanMode === "waybill") {
                if (!activeWb || !activeWb.active) {
                    showReadResult(rawInput, cleaned, "Aktif irsaliye oturumu açık değil.");
                    return;
                }
                const scanKey = "sc_" + Date.now() + "_" + Math.random().toString(36).slice(2, 6);
                await wbRef.child("okutulanlar").child(scanKey).set({
                    kod: cleaned,
                    adet: qty,
                    okutan: MOBIL_KULLANICI,
                    zaman: new Date().toLocaleTimeString("tr-TR")
                });
                showReadResult(rawInput, cleaned, `${cleaned} (${qty} adet) irsaliyeye işlendi.`);
                barcodeInputEl.value = "";
                document.getElementById("qtyInput").value = "1";
                barcodeInputEl.focus();
                return;
            }

            const plate = (document.getElementById("plateInput").value || "").trim().toUpperCase();
            const advisor = (document.getElementById("advisorInput").value || "").trim();
            const dept = document.getElementById("deptInput").value || "Mekanik";
            const desc = (document.getElementById("descInput").value || "").trim() || "-";

            if (!plate || !advisor) {
                alert("Sipariş kaydı için Plaka ve Danışman alanlarını doldurun.");
                return;
            }

            const newKey = "id_" + Date.now() + "_" + Math.random().toString(36).slice(2, 6);
            await ordersRef.child(newKey).set({
                bolum: dept,
                danisman: advisor,
                aracPlakasi: plate,
                parcaNumarasi: cleaned,
                adet: qty,
                parcaAciklamasi: desc,
                siparisTipi: "",
                bayiAdi: "",
                stokDurumu: "",
                siparisTarihi: "",
                gelisTarihi: "",
                siparisNumarasi: "",
                aciklama: "",
                guncelleyen: MOBIL_KULLANICI
            });
            showReadResult(rawInput, cleaned, `${cleaned} (${qty} adet) ${plate} plakasına kaydedildi.`);
            barcodeInputEl.value = "";
            document.getElementById("qtyInput").value = "1";
            barcodeInputEl.focus();
        }

        function handleDecodedBarcode(rawText) {
            const now = Date.now();
            const cleaned = cleanCode(rawText);
            if (!cleaned) return;
            if (cleaned === lastScanCode && now - lastScanTime < 1400) return;
            lastScanCode = cleaned;
            lastScanTime = now;

            barcodeInputEl.value = cleaned;
            showReadResult(rawText, cleaned, "Kamera okudu ve temizledi.");
            submitCurrentCode(rawText);
        }

        async function startCameraScanner() {
            const box = document.getElementById("scannerBox");
            const video = document.getElementById("scannerVideo");
            const label = document.getElementById("camToggleLabel");
            box.classList.remove("hidden");
            label.textContent = "Kamerayı Kapat";

            if (window.ZXing && ZXing.BrowserMultiFormatReader) {
                if (!codeReader) {
                    codeReader = new ZXing.BrowserMultiFormatReader();
                }
                try {
                    await codeReader.decodeFromVideoDevice(null, video, (result) => {
                        if (result && result.getText) {
                            handleDecodedBarcode(result.getText());
                        }
                    });
                    return;
                } catch (_) {}
            }

            if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
                video.srcObject = stream;
                await video.play();
                if ("BarcodeDetector" in window) {
                    const detector = new BarcodeDetector();
                    const scanLoop = async () => {
                        if (box.classList.contains("hidden")) return;
                        try {
                            const codes = await detector.detect(video);
                            if (codes.length && codes[0].rawValue) {
                                handleDecodedBarcode(codes[0].rawValue);
                            }
                        } catch (_) {}
                        requestAnimationFrame(scanLoop);
                    };
                    requestAnimationFrame(scanLoop);
                }
            }
        }

        function stopCameraScanner() {
            const box = document.getElementById("scannerBox");
            const video = document.getElementById("scannerVideo");
            const label = document.getElementById("camToggleLabel");
            box.classList.add("hidden");
            label.textContent = "Kamerayı Aç";
            if (codeReader) {
                try { codeReader.reset(); } catch (_) {}
            }
            if (video && video.srcObject) {
                video.srcObject.getTracks().forEach(t => t.stop());
                video.srcObject = null;
            }
        }

        function toggleCameraScanner() {
            const isHidden = document.getElementById("scannerBox").classList.contains("hidden");
            if (isHidden) {
                startCameraScanner();
            } else {
                stopCameraScanner();
            }
        }
    </script>
</body>
</html>
